services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: olist_dev
      POSTGRES_DB: olist
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olist -d olist"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped

  init:
    build:
      context: .
      dockerfile: Dockerfile
      target: ingest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://olist:olist_dev@db:5432/olist
      DATASET_URL: https://www.kaggle.com/api/v1/datasets/download/olistbr/brazilian-ecommerce
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://olist:olist_dev@db:5432/olist
      PORT: "3000"
      AGENT_MODE: fallback
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
